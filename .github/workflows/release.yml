name: Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional label for the candidate download"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roku/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check candidate source and versions
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:SOURCE_COMMIT) { throw 'Checkout does not match candidate source.' }
          $version = dotnet msbuild companion/src/ImmichLoungeCompanion/ImmichLoungeCompanion.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$') { throw 'Could not read a three-part project Version.' }
          $expected = @([int]$Matches[1], [int]$Matches[2], [int]$Matches[3]) -join '.'
          foreach ($manifest in @('roku/manifest', 'roku/manifest_screensaver')) {
            $fields = Get-Content -Raw -LiteralPath $manifest | ConvertFrom-StringData
            $parts = foreach ($key in @('major_version', 'minor_version', 'build_version')) {
              if ($fields[$key] -notmatch '^\d+$') { throw "Missing or invalid $key in $manifest" }
              [int]$fields[$key]
            }
            if (($parts -join '.') -cne $expected) { throw "Version mismatch in $manifest; expected $expected" }
          }

      - name: Build and package companion
        working-directory: companion
        run: |
          dotnet test --project tests/ImmichLoungeCompanion.Tests/ImmichLoungeCompanion.Tests.csproj --configuration Release
          dotnet publish src/ImmichLoungeCompanion/ImmichLoungeCompanion.csproj -c Release -o artifacts/companion
          mkdir -p "$GITHUB_WORKSPACE/_out/release"
          cd artifacts/companion
          for file in ImmichLoungeCompanion.dll ImmichLoungeCompanion.deps.json ImmichLoungeCompanion.runtimeconfig.json; do
            test -s "$file"
          done
          test -d wwwroot
          zip -qr "$GITHUB_WORKSPACE/_out/release/companion-release.zip" .

      - name: Build and package Roku apps
        working-directory: roku
        run: |
          npm ci
          npm run build
          npm run build:screensaver
          cmp manifest _out/build/channel/manifest
          cmp manifest_screensaver _out/build/screensaver/manifest
          test -s _out/build/channel/components/slideshow/SlideshowScene.xml
          test -s _out/build/screensaver/components/screensaver/ScreensaverScene.xml
          for app in channel screensaver; do
            (
              cd "_out/build/$app"
              test -s manifest
              test -s source/main.brs
              test ! -e source/test_main.brs
              # Unsigned sideload ZIP with manifest at the package root.
              zip -qr "$GITHUB_WORKSPACE/_out/release/roku-$app-build.zip" .
            )
          done

      - name: Build and package docs
        run: |
          pip install -r docs/website/requirements.txt
          zensical build --clean --strict
          cd _out/website
          for file in index.html support/index.html privacy/index.html tos/index.html; do
            test -s "$file"
          done
          zip -qr "$GITHUB_WORKSPACE/_out/release/docs-site.zip" .

      - name: Checksum candidate ZIPs
        working-directory: _out/release
        run: |
          sha256sum companion-release.zip roku-channel-build.zip roku-screensaver-build.zip docs-site.zip > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Attest candidate provenance
        uses: actions/attest@v4
        with:
          subject-path: _out/release/*
          create-storage-record: false

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name || 'immich-lounge-candidate' }}
          path: _out/release/
          if-no-files-found: error
          compression-level: 0
