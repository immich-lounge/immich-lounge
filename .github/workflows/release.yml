name: Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional label for the release artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roku/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check candidate source and versions
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:SOURCE_COMMIT) { throw 'Checkout does not match candidate source.' }
          $version = dotnet msbuild companion/src/ImmichLoungeCompanion/ImmichLoungeCompanion.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$') { throw 'Could not read a three-part project Version.' }
          $expected = @([int]$Matches[1], [int]$Matches[2], [int]$Matches[3]) -join '.'
          foreach ($manifest in @('roku/manifest', 'roku/manifest_screensaver')) {
            $fields = Get-Content -Raw -LiteralPath $manifest | ConvertFrom-StringData
            $parts = foreach ($key in @('major_version', 'minor_version', 'build_version')) {
              if ($fields[$key] -notmatch '^\d+$') { throw "Missing or invalid $key in $manifest" }
              [int]$fields[$key]
            }
            if (($parts -join '.') -cne $expected) { throw "Version mismatch in $manifest; expected $expected" }
          }

      - name: Install docs dependencies
        run: pip install -r docs/website/requirements.txt

      - name: Restore companion
        working-directory: companion
        run: dotnet restore tests/ImmichLoungeCompanion.Tests/ImmichLoungeCompanion.Tests.csproj

      - name: Install Roku dependencies
        working-directory: roku
        run: npm ci

      - name: Test companion
        working-directory: companion
        run: dotnet test --project tests/ImmichLoungeCompanion.Tests/ImmichLoungeCompanion.Tests.csproj --configuration Release

      - name: Publish companion
        working-directory: companion
        run: dotnet publish src/ImmichLoungeCompanion/ImmichLoungeCompanion.csproj -c Release -o artifacts/companion

      - name: Build Roku channel
        working-directory: roku
        run: npm run build

      - name: Build Roku screensaver
        working-directory: roku
        run: npm run build:screensaver

      - name: Build docs
        run: zensical build --clean --strict

      - name: Package candidate artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            companion/artifacts/companion/ImmichLoungeCompanion.dll \
            companion/artifacts/companion/ImmichLoungeCompanion.deps.json \
            companion/artifacts/companion/ImmichLoungeCompanion.runtimeconfig.json \
            roku/_out/build/channel/manifest \
            roku/_out/build/channel/source/main.brs \
            roku/_out/build/channel/components/slideshow/SlideshowScene.xml \
            roku/_out/build/screensaver/manifest \
            roku/_out/build/screensaver/source/main.brs \
            roku/_out/build/screensaver/components/screensaver/ScreensaverScene.xml \
            _out/website/index.html \
            _out/website/support/index.html \
            _out/website/privacy/index.html \
            _out/website/tos/index.html; do
            test -s "$file" || { echo "Missing or empty required file: $file" >&2; exit 1; }
          done
          cmp roku/manifest roku/_out/build/channel/manifest
          cmp roku/manifest_screensaver roku/_out/build/screensaver/manifest
          test -d companion/artifacts/companion/wwwroot
          test ! -e roku/_out/build/channel/source/test_main.brs
          test ! -e roku/_out/build/screensaver/source/test_main.brs
          # ZIP each staging root directly; Roku packages are unsigned sideload ZIPs.
          (cd companion/artifacts/companion && zip -qr "$GITHUB_WORKSPACE/companion-release.zip" .)
          (cd roku/_out/build/channel && zip -qr "$GITHUB_WORKSPACE/roku-channel-build.zip" .)
          (cd roku/_out/build/screensaver && zip -qr "$GITHUB_WORKSPACE/roku-screensaver-build.zip" .)
          (cd _out/website && zip -qr "$GITHUB_WORKSPACE/docs-site.zip" .)
          sha256sum companion-release.zip roku-channel-build.zip roku-screensaver-build.zip docs-site.zip > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Attest candidate artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            companion-release.zip
            roku-channel-build.zip
            roku-screensaver-build.zip
            docs-site.zip
            SHA256SUMS
          create-storage-record: false

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-checksums', inputs.release_name) || 'immich-lounge-checksums' }}
          path: SHA256SUMS
          if-no-files-found: error

      - name: Upload companion artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-companion', inputs.release_name) || 'immich-lounge-companion' }}
          path: companion-release.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Roku channel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-roku-channel', inputs.release_name) || 'immich-lounge-roku-channel' }}
          path: roku-channel-build.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Roku screensaver artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-roku-screensaver', inputs.release_name) || 'immich-lounge-roku-screensaver' }}
          path: roku-screensaver-build.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-docs', inputs.release_name) || 'immich-lounge-docs' }}
          path: docs-site.zip
          if-no-files-found: error
          compression-level: 0
