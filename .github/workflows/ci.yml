name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  companion:
    name: Companion Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/ImmichLoungeCompanion.Tests/ImmichLoungeCompanion.Tests.csproj

      - name: Build
        run: dotnet build src/ImmichLoungeCompanion/ImmichLoungeCompanion.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/ImmichLoungeCompanion.Tests/ImmichLoungeCompanion.Tests.csproj --configuration Release --no-restore

      - name: Build development fixture tooling
        run: dotnet build tests/LiveImmich/LiveImmich.csproj --configuration Release

  companion-docker:
    name: Companion Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            dotnet-arch: x64
            runner: ubuntu-latest
          - arch: arm64
            dotnet-arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --platform linux/${{ matrix.arch }} -t immich-lounge-companion:test ./companion

      - name: Check runtime and data volume
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name companion-smoke -p 127.0.0.1:4383:4383 -v companion-smoke-data:/data immich-lounge-companion:test
          trap 'docker logs companion-smoke; docker rm -f companion-smoke; docker volume rm companion-smoke-data' EXIT
          docker exec companion-smoke dotnet --info
          docker cp companion-smoke:/app/ImmichLoungeCompanion.deps.json /tmp/companion.deps.json
          grep -q 'linux-${{ matrix.dotnet-arch }}' /tmp/companion.deps.json
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4383/healthz
          curl --fail --silent --show-error -X PUT -H 'Content-Type: application/json' --data '{"friendlyName":"CI smoke test","immich":{"serverUrl":"http://192.0.2.1:2283"}}' http://127.0.0.1:4383/api/settings
          docker cp companion-smoke:/data/settings.json /tmp/companion.settings.json
          grep -q 'CI smoke test' /tmp/companion.settings.json

  roku:
    name: Roku Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roku
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roku/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test Roku scripts
        run: npm run test:scripts

      - name: Lint channel
        run: npm run lint

      - name: Lint screensaver
        run: npm run lint:screensaver

      - name: Build channel
        run: npm run build

      - name: Build screensaver
        run: npm run build:screensaver

      - name: Run Roku static analysis on channel
        run: npm run analyze

      - name: Run Roku static analysis on screensaver
        run: npm run analyze:screensaver
